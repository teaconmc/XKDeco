[[mixins]]
config="xkdeco.mixins.json"

# Datagen-only mixins (take over vanilla model generation, etc.). Targets are client/datagen
# classes, so the config is marked required=false to stay safe on a dedicated server where those
# classes are absent (the mixins are simply skipped there; they only apply during data generation).
[[mixins]]
config="xkdeco.data.mixins.json"

[modproperties.xkdeco]
kiwiCustomization=true

