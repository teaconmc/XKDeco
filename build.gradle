plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'idea'
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "2.+"
}

version = project.minecraft_version + "-Fabric-" + project.mod_version
group = project.mod_base_package
var realVersion = mod_version + '+fabric'

base {
    archivesName = project.mod_name
}

fabricApi {
    configureDataGeneration() {
        modId = project.mod_id
        client = true
        outputDirectory = file("src/generated/resources")
        createSourceSet = true
        strictValidation = true
    }
}

if (System.env.GITHUB_ACTIONS) {
    version += "-build.${System.env.GITHUB_RUN_NUMBER}"
}

static def isJetBrainsRuntime() {
    return System.getProperty('java.vm.vendor').contains('JetBrains')
}

loom {
    mixin {
        defaultRefmapName = "${project.mod_id}.refmap.json"
    }

    accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")
}

// Include resources generated by data generators.
//sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.resources { srcDir 'src/kiwi_generated/resources' }

repositories {
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        // saps.dev Maven (KubeJS and Rhino)
        url = "https://maven.saps.dev/minecraft"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
    maven { url = "https://maven.shedaniel.me/" }
    maven {
        // location of the maven that hosts JEI files
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    mavenLocal() // YES
    flatDir {
        dirs './libs'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.20.6:${project.mappings_version}@zip")
    }
//    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // https://modrinth.com/mod/jei/versions
    // compile against the JEI API but do not include it at runtime
    modCompileOnlyApi "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnlyApi "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    // at runtime, use the full JEI jar for Forge
    modImplementation "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    // https://linkie.shedaniel.dev/dependencies?loader=fabric&version=1.21.1
    modImplementation("dev.architectury:architectury-fabric:${project.architectury_version}")
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"

    // https://modrinth.com/mod/kiwi/versions
//    modImplementation fileTree(dir: "libs", include: ["*.jar"])
//    annotationProcessor fileTree(dir: "libs", include: ["*.jar"])
    modImplementation(annotationProcessor("maven.modrinth:kiwi:15.8.8+fabric"))

    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    // https://modrinth.com/mod/jade/versions
    modImplementation "maven.modrinth:jade:15.10.5+fabric"
    // implementation fg.deobf("maven.modrinth:uBKACKpl:qk7bNI3G") //shimmer

    // https://modrinth.com/mod/debugutils/versions
    modImplementation "maven.modrinth:debugutils:1.21.1-1.0.9-fabric"
    // https://modrinth.com/mod/modernfix/versions
    modImplementation "maven.modrinth:modernfix:5.25.1+mc1.21.1"
    // https://modrinth.com/mod/ferrite-core/versions
    modImplementation "maven.modrinth:ferrite-core:7.0.3-fabric"
    // https://modrinth.com/mod/suggestion-tweaker/versions
    modImplementation "maven.modrinth:suggestion-tweaker:1.20.6-1.5.3+fabric"
}

processResources {
    from('src/main/java') {
        include '**/*.json'
    }

    inputs.property "version", realVersion

    filesMatching("fabric.mod.json") {
        expand "version": realVersion

        if (!System.getProperty('idea.active')) {
            filter { String line ->
                line.replace('"org.teacon.xkdeco.data.XKDDataGen"', "")
            }
        }
    }

    doLast {
        if (System.getProperty('idea.active')) {
            return
        }

        def jsonMinifyStart = System.currentTimeMillis()
        def jsonMinified = 0
        def jsonBytesSaved = 0

        fileTree(dir: outputs.files.asPath, include: '**/*.json').each {
            jsonMinified++
            def oldLength = it.length()
            //noinspection UnnecessaryQualifiedReference
            it.text = groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parse(it))
            jsonBytesSaved += oldLength - it.length()
        }

        jsonBytesSaved = Math.round(jsonBytesSaved / 1024)
        println('Minified ' + jsonMinified + ' json files. Saved ' + jsonBytesSaved + 'KB. Took ' + (System.currentTimeMillis() - jsonMinifyStart) + 'ms.')
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
//    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    exclude("/assets/${project.mod_id}/lang/en_us.existing.json")
    exclude("/assets/test")
    exclude("/org/teacon/xkdeco/data")
    exclude("/org/teacon/xkdeco/mixin/data")
    exclude("/.cache")
    exclude("/xkdeco.data.mixins.json")

    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : realVersion,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

configurations.configureEach {
    resolutionStrategy {
        force "dev.architectury:architectury-fabric:${project.architectury_version}"
    }
}

publishMods {
    file = remapJar.archiveFile
    changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : ''
    type = ['release': STABLE, 'beta': BETA, 'alpha': ALPHA][release_type]
    modLoaders.add("fabric")
    modLoaders.add("quilt")
    displayName = "[Fabric ${supported_version}] ${mod_version}"
    version = realVersion

    curseforge {
        projectId = "497637"
        client = true
        server = true
        accessToken = providers.environmentVariable("CURSE_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("kiwi-fabric")
        requires("forgified-fabric-api")
        requires("cloth-config")
    }
    modrinth {
        projectId = "XlwMlNhH"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("kiwi")
        requires("forgified-fabric-api")
        requires("cloth-config")
    }
}
