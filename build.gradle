plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'idea'
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "2.+"
}

version = project.minecraft_version + "-Fabric-" + project.mod_version
group = project.mod_base_package
var realVersion = mod_version + '+fabric'

base {
    archivesName = project.mod_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

fabricApi {
    configureDataGeneration() {
        modId = project.mod_id
        client = true
        outputDirectory = file("src/generated/resources")
        createSourceSet = true
        strictValidation = false
    }
}

if (System.env.GITHUB_ACTIONS) {
    version += "-build.${System.env.GITHUB_RUN_NUMBER}"
}

static def isJetBrainsRuntime() {
    return System.getProperty('java.vm.vendor').contains('JetBrains')
}

loom {
    accessWidenerPath = file("src/main/resources/${project.mod_id}.classtweaker")

    runs {
        client {
            client()
            if (isJetBrainsRuntime()) {
                vmArg("-XX:+AllowEnhancedClassRedefinition")
                vmArg("-XX:HotswapAgent=fatjar")
            }
            vmArg("-Dmixin.debug.export=true")
        }
        server {
            server()
            vmArg("-Dmixin.debug.export=true")
        }
    }
}

// Include resources generated by data generators.
//sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.resources { srcDir 'src/kiwi_generated/resources' }

repositories {
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        // saps.dev Maven (KubeJS and Rhino)
        url = "https://maven.saps.dev/minecraft"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
    maven { url = "https://maven.shedaniel.me/" }
    maven {
        // location of the maven that hosts JEI files
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    mavenLocal() // YES
    flatDir {
        dirs './libs'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // https://modrinth.com/mod/kiwi/versions
    implementation(annotationProcessor("maven.modrinth:kiwi:${project.kiwi_version}+fabric"))

    // https://linkie.shedaniel.dev/dependencies?loader=fabric
    api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // https://modrinth.com/mod/jade/versions
    implementation "maven.modrinth:jade:26.1.11+fabric"

    // https://modrinth.com/mod/polytone/versions
    implementation "maven.modrinth:polytone:x0yjEtvl"

    // -- JEI: https://modrinth.com/mod/jei/versions
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    implementation "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    // -- Architectury / REI: https://linkie.shedaniel.dev/dependencies?loader=fabric
    implementation "dev.architectury:architectury-fabric:${architectury_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
}

processResources {
    from('src/main/java') {
        include '**/*.json'
    }

    inputs.property "version", realVersion

    filesMatching("fabric.mod.json") {
        expand "version": realVersion
    }

    doLast {
        if (System.getProperty('idea.active')) {
            return
        }

        def jsonMinifyStart = System.currentTimeMillis()
        def jsonMinified = 0
        def jsonBytesSaved = 0

        fileTree(dir: outputs.files.asPath, include: '**/*.json').each {
            jsonMinified++
            def oldLength = it.length()
            //noinspection UnnecessaryQualifiedReference
            it.text = groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parse(it))
            jsonBytesSaved += oldLength - it.length()
        }

        jsonBytesSaved = Math.round(jsonBytesSaved / 1024)
        println('Minified ' + jsonMinified + ' json files. Saved ' + jsonBytesSaved + 'KB. Took ' + (System.currentTimeMillis() - jsonMinifyStart) + 'ms.')
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

jar {
    exclude("/assets/${project.mod_id}/lang/en_us.existing.json")
    exclude("/assets/test")
    exclude("/org/teacon/xkdeco/data")
    exclude("/org/teacon/xkdeco/mixin/data")
    exclude("/.cache")
    exclude("/xkdeco.data.mixins.json")
    exclude("**/*.py")
    // The Kiwi annotation processor writes xkdeco.kiwi.yaml into the classes dir while it is
    // also shipped as a regular resource; keep a single copy.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : realVersion,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    file = jar.archiveFile
    changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : ''
    type = ['release': STABLE, 'beta': BETA, 'alpha': ALPHA][release_type]
    modLoaders.add("fabric")
    modLoaders.add("quilt")
    displayName = "[Fabric ${supported_version}] ${mod_version}"
    version = realVersion

    curseforge {
        projectId = "497637"
        client = true
        server = true
        accessToken = providers.environmentVariable("CURSE_TOKEN")
        minecraftVersions.add(minecraft_version)
        minecraftVersions.add(archive_minecraft_version)
        requires("kiwi-fabric")
        requires("cloth-config")
        optional("polytone")
    }
    modrinth {
        projectId = "XlwMlNhH"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        minecraftVersions.add(archive_minecraft_version)
        requires("kiwi")
        requires("cloth-config")
        optional("polytone")
    }
}
